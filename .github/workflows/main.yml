name: Deploy V2 Preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-v2-preview:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout V2 development branch
        uses: actions/checkout@v4
        with:
          ref: v2-development

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload V2 site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy V2 to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
